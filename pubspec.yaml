name: mk_photo_studio
description: "MK Photo Studio Bill Generator - Professional billing for photography services"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.1.2

  # Date & Number Formatting
  intl: ^0.19.0

  # PDF Generation & Sharing
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.3

  # File Paths
  path_provider: ^2.1.4

  # Utilities
  uuid: ^4.5.1
  #dot env
  flutter_dotenv: ^5.2.1

  # Swipe to delete
  flutter_slidable: ^3.1.1
  mongo_dart: ^0.10.10

  # Image picker for logo/profile upload
  image_picker: ^1.1.2

  # Password hashing
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env
    - asserts/
